name: Deploy Archive Page

# One-off: replaces the live site with the static "archived" page in archive/.
# Unknown paths fall back to index.html (Cloudflare Pages serves the root page when there is no 404.html).
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: wasitdown
          directory: archive
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "3"
